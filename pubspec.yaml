name: snoop
description: >-
  In-app debug inspector for Flutter. Inspect live Bloc/Cubit state, Dio
  network requests, logs and navigation in a floating dev-tools overlay.
version: 0.1.0
homepage: https://github.com/sawongam/snoop
repository: https://github.com/sawongam/snoop
issue_tracker: https://github.com/sawongam/snoop/issues
documentation: https://github.com/sawongam/snoop#readme
topics:
  - bloc
  - dio
  - debugging
  - network
  - devtools


environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  dio: ^5.4.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
