name: snoop_workspace
publish_to: none

environment:
  sdk: '>=3.10.0 <4.0.0'

workspace:
  - packages/snoop
  - packages/snoop_dio
  - packages/snoop_http
  - packages/snoop_bloc
  - packages/snoop_chopper
  - packages/snoop_riverpod
  - packages/snoop_signals
  - apps/playground

dev_dependencies:
  melos: ^8.0.0

melos:
  repository: https://github.com/sawongam/snoop
  scripts:
    analyze:
      description: Analyze every package.
      exec: flutter analyze --no-pub .
    test:
      description: Run the tests of every package that has them.
      exec: flutter test --no-pub
      packageFilters:
        dirExists: test
    format:
      description: Check formatting everywhere.
      run: dart format --set-exit-if-changed .
    dry-run:
      description: Check every package under packages/ can be published.
      exec: dart pub publish --dry-run
      packageFilters:
        noPrivate: true
