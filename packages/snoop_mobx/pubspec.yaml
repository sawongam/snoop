name: snoop_mobx
description: >-
  MobX adapter for snoop, the in-app Flutter debug inspector. Shows every
  store's observables with their values, history, diffs and errors.
version: 0.1.0
homepage: https://github.com/sawongam/snoop
repository: https://github.com/sawongam/snoop/tree/master/packages/snoop_mobx
issue_tracker: https://github.com/sawongam/snoop/issues
topics:
  - mobx
  - debugging
  - devtools
  - state-management

resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  mobx: ^2.3.0
  snoop: ^0.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
