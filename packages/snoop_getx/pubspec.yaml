name: snoop_getx
description: >-
  GetX adapter for snoop, the in-app Flutter debug inspector. Shows controller
  lifecycle, Rx values and GetConnect calls.
version: 1.0.0
homepage: https://github.com/sawongam/snoop
repository: https://github.com/sawongam/snoop/tree/master/packages/snoop_getx
issue_tracker: https://github.com/sawongam/snoop/issues
topics:
  - getx
  - debugging
  - devtools
  - state-management

resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.7.1
  snoop: ^1.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
