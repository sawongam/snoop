name: snoop_riverpod
description: >-
  Riverpod adapter for snoop, the in-app Flutter debug inspector. Shows every
  provider with its value, history, diffs and errors.
version: 0.1.0
homepage: https://github.com/sawongam/snoop
repository: https://github.com/sawongam/snoop/tree/master/packages/snoop_riverpod
issue_tracker: https://github.com/sawongam/snoop/issues
topics:
  - riverpod
  - debugging
  - devtools
  - state-management

resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  riverpod: ^3.3.2
  snoop: ^0.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_riverpod: ^3.3.2
  flutter_test:
    sdk: flutter
