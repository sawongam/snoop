name: snoop_signals
description: >-
  Signals adapter for snoop, the in-app Flutter debug inspector. Shows every
  signal with its value, history, diffs and call sites.
version: 0.1.0
homepage: https://github.com/sawongam/snoop
repository: https://github.com/sawongam/snoop/tree/master/packages/snoop_signals
issue_tracker: https://github.com/sawongam/snoop/issues
topics:
  - signals
  - debugging
  - devtools
  - state-management

resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  signals_core: '>=6.0.0 <8.0.0'
  snoop: ^0.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
