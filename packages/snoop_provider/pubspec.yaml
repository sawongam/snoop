name: snoop_provider
description: >-
  Provider adapter for snoop, the in-app Flutter debug inspector. Tracks any
  ChangeNotifier or Listenable with snapshot history, diffs and call sites.
version: 1.0.0
homepage: https://github.com/sawongam/snoop
repository: https://github.com/sawongam/snoop/tree/master/packages/snoop_provider
issue_tracker: https://github.com/sawongam/snoop/issues
topics:
  - provider
  - debugging
  - devtools
  - state-management

resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.0
  snoop: ^1.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
