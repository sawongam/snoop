name: snoop_bloc
description: >-
  Bloc adapter for snoop, the in-app Flutter debug inspector. Shows every
  live bloc and cubit with its state, history, diffs and errors.
version: 1.0.0
homepage: https://github.com/sawongam/snoop
repository: https://github.com/sawongam/snoop/tree/master/packages/snoop_bloc
issue_tracker: https://github.com/sawongam/snoop/issues
topics:
  - bloc
  - debugging
  - devtools
  - state-management

resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  bloc: '>=8.1.0 <10.0.0'
  flutter:
    sdk: flutter
  snoop: ^1.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
