name: snoop_chopper
description: >-
  Chopper adapter for snoop, the in-app Flutter debug inspector. Records every
  request, response and error, with replay and simulated network trouble.
version: 0.1.0
homepage: https://github.com/sawongam/snoop
repository: https://github.com/sawongam/snoop/tree/master/packages/snoop_chopper
issue_tracker: https://github.com/sawongam/snoop/issues
topics:
  - chopper
  - debugging
  - devtools
  - network

resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  chopper: ^8.2.0
  flutter:
    sdk: flutter
  http: ^1.5.0
  snoop: ^0.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
